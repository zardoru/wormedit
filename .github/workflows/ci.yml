name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# A label event gets its own group so it never cancels the code run for the same ref.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}
  cancel-in-progress: true

jobs:
  headless:
    name: headless (${{ matrix.name }})
    # Adding a label only needs to (re)start the Windows job.
    if: github.event.action != 'labeled'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            linux_packages: g++-14
            preset: headless-events
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
            linux_packages: clang-19 g++-14
            cxx_flags: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14
            preset: headless
          - name: macos
            os: macos-latest
            cc: clang
            cxx: clang++
            preset: headless
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: ${{ matrix.name == 'linux-gcc' }}

      - name: Install frontend build tools
        if: matrix.name == 'linux-gcc'
        run: |
          sudo apt-get update && sudo apt-get install -y zlib1g-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/frontend-tools"
          "$RUNNER_TEMP/frontend-tools/bin/pip" install cmake==4.2.3
          echo "$RUNNER_TEMP/frontend-tools/bin" >> "$GITHUB_PATH"

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.linux_packages }}

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: ${{ matrix.cxx_flags }}
        run: >-
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      - name: Check event harness discovery
        if: matrix.name == 'linux-gcc'
        run: |
          ctest --preset headless-events --show-only=json-v1 > /tmp/tests.json
          python3 - <<'PY'
          import json
          tests = json.load(open('/tmp/tests.json'))['tests']
          harness = [t for t in tests if any(
              p['name'] == 'LABELS' and 'event-harness' in p['value']
              for p in t.get('properties', []))]
          assert len(harness) >= 12, f'Expected at least 12 event harness tests, got {len(harness)}'
          PY

      # Serial on purpose: some tests assert wall-clock ceilings. The timeout turns a
      # hung test into a quick failure instead of ctest's 25 minute default.
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --timeout 120

  # Windows is slow, so on pull requests it runs only when the PR has the `windows`
  # label (and on every push to main). Release avoids MSVC's very slow debug runtime.
  windows:
    name: headless (windows-msvc)
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        env:
          CC: cl
          CXX: cl
        run: cmake --preset headless -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build --preset headless -- -k 0

      - name: Test
        run: ctest --preset headless --output-on-failure --timeout 120
