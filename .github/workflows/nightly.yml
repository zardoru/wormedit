name: Nightly

# Builds the Linux AppImage and the Windows zip from main and keeps them as workflow
# artifacts. Nothing is published to Releases.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main has no commits in the last 24 hours
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    name: changes on main
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
      suffix: ${{ steps.decide.outputs.suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - id: decide
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          echo "suffix=-nightly.$(date -u +%Y%m%d).$sha" >> "$GITHUB_OUTPUT"
          recent=$(git log --since='24 hours ago' --format=%H -1)
          if [[ -n $recent || '${{ inputs.force }}' == 'true' ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  linux-appimage:
    name: linux AppImage
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
      - name: Build AppImage
        env:
          WORMEDIT_VERSION_SUFFIX: ${{ needs.check.outputs.suffix }}
        run: scripts/linux-appimage.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: wormedit-nightly-linux
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  windows-zip:
    name: windows zip (mingw cross)
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
      - name: Install tools
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          mingw-w64 ninja-build zip pkg-config make curl xz-utils python3 ruby-asciidoctor
      - name: Use the posix thread model
        run: |
          for t in gcc g++; do
            sudo update-alternatives --set x86_64-w64-mingw32-$t /usr/bin/x86_64-w64-mingw32-$t-posix
          done
      # The pinned FFmpeg and LAME SDK only changes with these scripts.
      - uses: actions/cache@v4
        id: sdk
        with:
          path: build/windows-ffmpeg
          key: windows-ffmpeg-${{ hashFiles('scripts/windows-ffmpeg.sh', 'packaging/build-lame-sdk.sh', 'scripts/env-mingw.sh') }}
      - name: Build the FFmpeg SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        env:
          WORMEDIT_BUILD_JOBS: 4
        run: scripts/windows-ffmpeg.sh
      - name: Package
        env:
          WORMEDIT_BUILD_JOBS: 4
          CMAKE_ARGS: -DWORMEDIT_VERSION_SUFFIX=${{ needs.check.outputs.suffix }}
        run: scripts/windows-cross-package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: wormedit-nightly-windows
          path: dist/*
          retention-days: 14
          if-no-files-found: error
