name: Nightly

# Builds the Linux AppImage and the Windows zip from main and keeps them as workflow
# artifacts. A manual run with "release" ticked builds with the version in CMakeLists.txt
# (for example 1.0.0-rc3) and attaches the packages to a DRAFT pre-release with the notes
# from docs/release-notes. The draft creates its tag only when the owner publishes it.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main has no commits in the last 24 hours
        type: boolean
        default: false
      release:
        description: Release build - use the CMakeLists.txt version and create a draft pre-release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    name: changes on main
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
      suffix: ${{ steps.decide.outputs.suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - id: decide
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          if [[ '${{ inputs.release }}' == 'true' ]]; then
            suffix=$(sed -n 's/^set(WORMEDIT_VERSION_SUFFIX "\([^"]*\)".*/\1/p' CMakeLists.txt)
            [[ -n $suffix ]] || { echo 'CMakeLists.txt has no release suffix' >&2; exit 1; }
          else
            suffix="-nightly.$(date -u +%Y%m%d).$sha"
          fi
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          recent=$(git log --since='24 hours ago' --format=%H -1)
          if [[ -n $recent || '${{ inputs.force }}' == 'true' || '${{ inputs.release }}' == 'true' ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  linux-appimage:
    name: linux AppImage
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
      - name: Build AppImage
        env:
          WORMEDIT_VERSION_SUFFIX: ${{ needs.check.outputs.suffix }}
        run: scripts/linux-appimage.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: wormedit-nightly-linux
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  windows-zip:
    name: windows zip (mingw cross)
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    # Ubuntu's mingw-w64 is GCC 13, whose libstdc++ has no std::bind_back. Debian 13 ships
    # mingw-w64 GCC 14.
    container: debian:trixie
    # Job containers default to sh; the steps below use bash features.
    defaults:
      run:
        shell: bash
    timeout-minutes: 120
    steps:
      - name: Install tools
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          ca-certificates git gcc libc6-dev gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix
          binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev ninja-build zip pkg-config make curl
          xz-utils tar zstd python3 python3-venv asciidoctor
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
      # libotoworm needs CMake 4.2; Debian 13 ships 3.31. Same pin as the CI workflow.
      - name: Install CMake 4.2
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install cmake==4.2.3
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Use the posix thread model
        run: |
          for t in gcc g++; do
            update-alternatives --set x86_64-w64-mingw32-$t /usr/bin/x86_64-w64-mingw32-$t-posix
          done
          x86_64-w64-mingw32-g++ --version | head -1
      # The pinned FFmpeg and LAME SDK only changes with these scripts.
      - uses: actions/cache@v4
        id: sdk
        with:
          path: build/windows-ffmpeg
          key: windows-ffmpeg-${{ hashFiles('scripts/windows-ffmpeg.sh', 'packaging/build-lame-sdk.sh', 'scripts/env-mingw.sh') }}
      - name: Build the FFmpeg SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        env:
          WORMEDIT_BUILD_JOBS: 4
        run: scripts/windows-ffmpeg.sh
      - name: Package
        env:
          WORMEDIT_BUILD_JOBS: 4
          CMAKE_ARGS: -DWORMEDIT_VERSION_SUFFIX=${{ needs.check.outputs.suffix }}
        run: |
          # Debian's mingw-w64 keeps libwinpthread-1.dll beside its import library, outside
          # the places windows-ffmpeg.sh looks, so make sure the SDK carries it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sdk=build/windows-ffmpeg/prefix
          dll=/usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll
          if [[ ! -f $sdk/bin/libwinpthread-1.dll ]]; then
            cp -v "$dll" "$sdk/bin/"
            cp -v /usr/x86_64-w64-mingw32/include/pthread.h "$sdk/share/wormedit-ffmpeg/winpthreads-notices.h"
          fi
          ls -la "$sdk/bin" | grep -i pthread
          scripts/windows-cross-package.sh dist || {
            status=$?
            echo '--- diagnostics ---'
            ls -la "$sdk/bin"
            ls -la build/windows-cross-stage/*/ | head -30
            exit $status
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wormedit-nightly-windows
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  draft-release:
    name: draft pre-release
    needs: [check, linux-appimage, windows-zip]
    if: inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          SUFFIX: ${{ needs.check.outputs.suffix }}
        run: |
          version="1.0.0${SUFFIX}"
          notes="docs/release-notes/${version}.md"
          [[ -f $notes ]] || { echo "Missing $notes" >&2; exit 1; }
          gh release create "v${version}" dist/* \
            --draft --prerelease --target "$(git rev-parse HEAD)" \
            --title "Wormedit ${version}" --notes-file "$notes"
